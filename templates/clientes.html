{% extends "base.html" %}

{% block title %}
Registro de Clientes
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-12 col-md-8 col-lg-6">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="card-title mb-4">
                    Registro de Clientes
                </h2>

                <form method="POST">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            name="nombre"
                            required>
                    </div>


                    <div class="mb-3">
                        <label for="nit" class="form-label">
                            NIT
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nit"
                            name="nit"
                            required>
                    </div>


                    <div class="mb-3">
                        <label for="correo" class="form-label">
                            Correo
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="correo"
                            name="correo"
                            required>
                    </div>


                    <div class="mb-3">
                        <label for="telefono" class="form-label">
                            Teléfono
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="telefono"
                            name="telefono"
                            required>
                    </div>


                    <div class="mb-3">
                        <label for="direccion" class="form-label">
                            Dirección
                        </label>

                        <textarea
                            class="form-control"
                            id="direccion"
                            name="direccion"
                            rows="3"
                            required></textarea>
                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary">
                        Registrar Cliente
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
