{% extends "base.html" %}

{% block title %}
Registro de Proveedores
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-12 col-md-8 col-lg-6">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="card-title mb-4">
                    Registro de Proveedores
                </h2>

                <form method="POST">

                    <div class="mb-3">
                        <label for="empresa" class="form-label">
                            Empresa
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="empresa"
                            name="empresa"
                            required>
                    </div>


                    <div class="mb-3">
                        <label for="contacto" class="form-label">
                            Contacto
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="contacto"
                            name="contacto"
                            required>
                    </div>


                    <div class="mb-3">
                        <label for="nit" class="form-label">
                            NIT
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nit"
                            name="nit"
                            required>
                    </div>


                    <div class="mb-3">
                        <label for="tipo" class="form-label">
                            Tipo de producto o servicio
                        </label>

                        <select
                            class="form-select"
                            id="tipo"
                            name="tipo"
                            required>

                            <option value="">
                                Seleccione una opción
                            </option>

                            <option value="Productos">
                                Productos
                            </option>

                            <option value="Servicios">
                                Servicios
                            </option>

                            <option value="Tecnologia">
                                Tecnología
                            </option>

                            <option value="Transporte">
                                Transporte
                            </option>

                        </select>
                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Condición de pago
                        </label>

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="pago"
                                id="contado"
                                value="Contado"
                                required>

                            <label
                                class="form-check-label"
                                for="contado">
                                Contado
                            </label>

                        </div>

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="pago"
                                id="credito"
                                value="Crédito"
                                required>

                            <label
                                class="form-check-label"
                                for="credito">
                                Crédito
                            </label>

                        </div>

                    </div>


                    <div class="form-check mb-3">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="activo"
                            name="activo">

                        <label
                            class="form-check-label"
                            for="activo">
                            Proveedor activo
                        </label>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary">
                        Registrar Proveedor
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
