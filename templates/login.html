{% extends "base.html" %}

{% block title %}
Inicio de Sesión
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-12 col-md-6 col-lg-4">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="card-title text-center mb-4">
                    Iniciar Sesión
                </h2>

                <form method="POST">

                    <div class="mb-3">

                        <label
                            for="usuario"
                            class="form-label">
                            Usuario
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="usuario"
                            name="usuario"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="contrasena"
                            class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="contrasena"
                            name="contrasena"
                            required>

                    </div>


                    <div class="form-check mb-3">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="recordar"
                            name="recordar">

                        <label
                            class="form-check-label"
                            for="recordar">
                            Recordarme
                        </label>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100">
                        Ingresar
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
